<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0b">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="NutriTrack – a private, offline-friendly nutrition tracker with an Indian food database.">
  <title>NutriTrack</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="is-loading">
  <a class="skip" href="#view">Skip to content</a>

  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/dashboard" aria-label="NutriTrack home">
        <span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Nutri<b>Track</b></span>
      </a>
      <nav id="side-nav"></nav>
      <p class="side-foot">Nutrition values are estimates. Your data stays on this device.</p>
    </aside>

    <header class="topbar">
      <a class="brand" href="#/dashboard" aria-label="NutriTrack home">
        <span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Nutri<b>Track</b></span>
      </a>
      <a class="avatar" href="#/profile" data-nav="profile" aria-label="Profile and goals"><span id="avatar">N</span></a>
    </header>

    <main id="view" class="view" tabindex="-1">
      <div class="boot"><span class="spinner" aria-hidden="true"></span><p>Loading NutriTrack…</p></div>
    </main>

    <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation"></nav>
  </div>

  <div id="modals"></div>
  <div id="toasts" aria-live="polite"></div>

  <noscript><p style="padding:24px;color:#fff">NutriTrack needs JavaScript to run.</p></noscript>

  <script src="js/foods.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
